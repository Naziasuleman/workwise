# The whole development environment. You need only Docker installed.
# First time: docker compose build && docker compose run --rm web bin/rails db:create
# Daily:      docker compose up      Stop: Ctrl+C or docker compose down      Wipe data: docker compose down -v

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: workwise_dev
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  environment:
    DATABASE_URL: postgres://postgres:postgres@postgres:5432
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  stdin_open: true
  tty: true

services:
  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"

  # worker (Sidekiq) is added later, at the "email on assignment" step.

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  bundle:
  postgres_data:
  redis_data:
